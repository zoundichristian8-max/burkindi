<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Burkindi Commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%276%27 fill=%27%23E3A23B%27/%3E%3Cpath d=%27M12 9h9c4 0 6 2.2 6 5 0 2-1 3.4-3 4 2.4.5 4 2 4 4.6 0 3.2-2.4 5.4-6.4 5.4H12z%27 fill=%27%231B2257%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#1B2257">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="Burkindi Commerce : le commerce africain sans frontières.">
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: indigo header band with a woven bogolan-style strip, cotton-coloured page, framed product cards, product sheet as an overlay. */
:root{
  --bg:#EFE9DC; --surface:#FAF6EE; --fg:#1B1F3B; --muted:#5C5E78; --line:#D6CCB8;
  --primary:#232C6B; --on-primary:#F7F3EA; --accent:#C9841A; --on-accent:#2B1D00; --madder:#A93E26;
  --band:#1B2257; --band-fg:#F3ECDD; --weave-bg:#141A44; --wa:#17803F; --ok:#1B7F4B; --danger:#B3261E;
  --display:'Bricolage Grotesque','Noto Sans Arabic',system-ui,sans-serif;
  --body:'DM Sans','Noto Sans Arabic',system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101330; --surface:#181C42; --fg:#F1EBDD; --muted:#ABAFD0; --line:#2C3262;
  --primary:#E3A23B; --on-primary:#1B1305; --accent:#E3A23B; --madder:#E0775B;
  --band:#0A0D26; --band-fg:#F3ECDD; --weave-bg:#0A0D26; --ok:#6CD39B; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101330; --surface:#181C42; --fg:#F1EBDD; --muted:#ABAFD0; --line:#2C3262;
  --primary:#E3A23B; --on-primary:#1B1305; --accent:#E3A23B; --madder:#E0775B;
  --band:#0A0D26; --band-fg:#F3ECDD; --weave-bg:#0A0D26; --ok:#6CD39B; --danger:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;padding-left:var(--gl);padding-right:var(--gr);padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto}
.band{background:var(--band);color:var(--band-fg);margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding-left:var(--gl);padding-right:var(--gr);padding-top:4px}
.weave{display:block;width:100%;height:20px;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));width:calc(100% + var(--gl) + var(--gr))}
.pb{fill:var(--weave-bg)}.pz{stroke:var(--accent)}.pd{fill:var(--band-fg)}.pm{fill:var(--madder)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.05}
.brand-t b{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:.02em}
.brand-t span{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
.tools{display:flex;gap:8px;align-items:center}
.proto{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border:1px dashed currentColor;border-radius:4px;opacity:.8}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:88px}
.lang{width:auto;font-weight:700;background:transparent;color:var(--band-fg);border-color:color-mix(in srgb,var(--band-fg) 40%,transparent)}
.lang option{color:#1B1F3B}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:0 22px;padding-top:8px}
nav a{padding:12px 16px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
h1,h2{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6.5vw,3.2rem);line-height:1.02;font-weight:800}
h2{font-size:1.5rem;font-weight:800}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--madder)}
.hero{padding-block:8px 18px;display:grid;gap:12px;max-width:680px}
.hero p{margin:0;color:var(--muted);font-size:1.05rem}
.trust{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:4px}
.trust span{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.92rem}
.dia{width:9px;height:9px;background:var(--accent);transform:rotate(45deg);flex:none}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip.fav{display:inline-flex;align-items:center;gap:6px}
.countrow{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;box-shadow:0 1px 0 var(--line)}
.ph{display:block;width:calc(100% - 16px);margin:8px;padding:0;border:0;background:none;border-radius:4px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;outline-offset:2px}
.ph svg,.ph img,.gal-main svg,.gal-main img{display:block;width:100%;height:100%;object-fit:cover}
.heart{position:absolute;top:14px;inset-inline-end:14px;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 92%,transparent);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.heart[aria-pressed="true"]{color:var(--madder)}
.heart[aria-pressed="true"] path{fill:currentColor}
.body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:1.05rem;padding:3px 10px;border-radius:3px;font-variant-numeric:tabular-nums}
.body h3{margin:0;font-size:1.05rem;line-height:1.3;font-weight:700}
.body h3 button{all:unset;cursor:pointer;overflow-wrap:anywhere}
.body h3 button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meta{color:var(--muted);font-size:.88rem}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.88rem}
.ver{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:700;font-size:.8rem}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.btn{background:var(--primary);color:var(--on-primary);border:0;border-radius:6px;padding:10px 16px;min-height:44px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.wa{background:var(--wa);color:#fff}
.btn.sm{padding:8px 12px;min-height:40px;flex:1;font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;max-width:600px}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:700;font-size:.92rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{font-weight:500;border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;gap:8px;align-items:center;cursor:pointer;min-height:44px}
.seg input{width:auto;min-height:0}
.drop{position:relative;border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);font-weight:500;display:grid;gap:4px;justify-items:center}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);cursor:pointer;font-weight:700;line-height:1}
.profile{display:grid;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.6rem}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--primary) 14%,var(--surface));border:1px solid var(--line)}
.threads{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px;max-height:46vh;overflow-y:auto;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.msg{max-width:80%;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.send{display:flex;gap:8px}
.card.vedette{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.spons{display:inline-block;align-self:flex-start;margin-inline-start:8px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--madder)}
.vedette .spons{background:var(--accent);color:var(--on-primary);padding:1px 6px;border-radius:4px}
.boost{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;margin-top:12px}
.boost .boosto{display:flex;justify-content:space-between;gap:8px;text-align:start}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;text-align:start}
.shop{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.shop .btnrow{grid-column:1/-1}
.shoplogo{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--primary);color:var(--on-primary)}
.shoplogo.ini{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.6rem}
.shopinfo h2{margin:0;font-size:1.2rem;overflow-wrap:anywhere}
.shopinfo p{margin:4px 0 0;overflow-wrap:anywhere}
.shopform{display:grid;gap:10px;margin-top:12px}
.chathead{font-weight:700;margin-bottom:8px;overflow-wrap:anywhere}
#nav a[data-unread]::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--madder);margin-inline-start:6px;vertical-align:middle}
.msg small{display:block;opacity:.7;font-size:12px;margin-top:2px}
.pay{margin-top:20px;display:grid;gap:8px}
.pay .chip{cursor:default}
.empty{color:var(--muted);padding:28px;border:2px dashed var(--line);border-radius:8px;text-align:center}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:8px;font-weight:700;text-align:center;z-index:60}
/* product sheet */
.ov{position:fixed;inset:0;background:rgba(10,13,38,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:860px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));position:relative}
.sheet-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
.vid{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;margin-top:4px}.vid.port{aspect-ratio:9/16;max-height:70vh;margin-inline:auto}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.vbadge{position:absolute;left:8px;bottom:8px;background:rgba(27,34,87,.88);color:#fff;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px}.ph{position:relative}
.terms{display:grid;gap:12px;padding-inline-start:22px;line-height:1.55}.soldb{position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:4px;letter-spacing:.05em}.soldb.inl{position:static;display:inline-block;vertical-align:middle;margin-inline-start:6px}.card.sold .ph img,.card.sold .ph svg{opacity:.45}footer a{color:inherit}#fsort{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:inherit;max-width:55%}
.gal-main{aspect-ratio:4/3;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.gal-th{display:flex;gap:8px;margin-top:8px}
.gal-th button{width:64px;height:48px;border:2px solid transparent;padding:0;border-radius:4px;overflow:hidden;background:none;cursor:pointer}
.gal-th button[aria-pressed="true"]{border-color:var(--accent)}
.gal-th img,.gal-th svg{width:100%;height:100%;object-fit:cover;display:block}
.x{position:absolute;top:10px;inset-inline-end:max(10px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.3rem;font-weight:700;z-index:2}
.det{display:grid;gap:12px;align-content:start;min-width:0}
.det h2{padding-inline-end:48px;font-size:1.4rem}
.big{font-family:var(--display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.92rem}
dt{color:var(--muted)}dd{margin:0;font-weight:500}
.tip{font-size:.86rem;color:var(--muted);border-inline-start:3px solid var(--accent);padding-inline-start:10px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:140px}
.note{margin:8px 0 16px;padding:10px 14px;border-inline-start:4px solid var(--accent);background:var(--surface);color:var(--muted);font-size:.92rem;border-radius:4px;max-width:640px}
footer{margin-top:40px}
footer .weave{margin:0;width:100%;border-radius:3px}
footer p{margin:14px 0 0;color:var(--muted);font-size:.85rem}
@media (max-width:640px){.filters{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.sheet-grid{grid-template-columns:1fr}}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:14px}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="bogo" width="48" height="20" patternUnits="userSpaceOnUse">
    <rect width="48" height="20" class="pb"/>
    <path d="M0 8L6 3L12 8L18 3L24 8L30 3L36 8L42 3L48 8" class="pz" fill="none" stroke-width="2"/>
    <circle cx="6" cy="15" r="1.7" class="pd"/><circle cx="18" cy="15" r="1.7" class="pd"/><circle cx="30" cy="15" r="1.7" class="pd"/><circle cx="42" cy="15" r="1.7" class="pd"/>
    <path d="M24 12L27 15L24 18L21 15Z" class="pm"/><path d="M48 12L51 15L48 18L45 15Z" class="pm"/><path d="M0 12L3 15L0 18L-3 15Z" class="pm"/>
  </pattern>
</defs></svg>

<div class="band">
  <div class="wrap">
    <header>
      <div class="brand">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="6" fill="#E3A23B"/><path d="M12 9h9c4 0 6 2.2 6 5 0 2-1 3.4-3 4 2.4.5 4 2 4 4.6 0 3.2-2.4 5.4-6.4 5.4H12z" fill="#1B2257"/><path d="M17 14v3.6h3c1.2 0 2-.7 2-1.8s-.8-1.8-2-1.8zm0 8.2v4.2h3.4c1.4 0 2.3-.8 2.3-2.1s-.9-2.1-2.3-2.1z" fill="#E3A23B"/></svg>
        <div class="brand-t"><b>BURKINDI</b><span>Commerce</span></div>
      </div>
      <div class="tools">
        <span class="proto" data-i18n="proto"></span>
        <select id="lang" class="lang" aria-label="Langue / Language">
          <option value="fr">FR</option><option value="en">EN</option><option value="pt">PT</option><option value="ar">AR</option>
        </select>
      </div>
    </header>
  </div>
  <svg class="weave" aria-hidden="true"><rect width="100%" height="20" fill="url(#bogo)"/></svg>
</div>

<div class="wrap">
  <nav id="nav" aria-label="Navigation">
    <a href="#annonces" data-v="annonces" data-i18n="n_list"></a>
    <a href="#vendre" data-v="vendre" data-i18n="n_sell"></a>
    <a href="#messages" data-v="messages" data-i18n="n_msg"></a>
    <a href="#compte" data-v="compte" data-i18n="n_acc"></a>
  </nav>

  <main>
    <section id="v-annonces" data-view>
      <div class="hero">
        <span class="kicker" data-i18n="slogan"></span>
        <h1 data-i18n="h_title"></h1>
        <p data-i18n="h_sub"></p>
        <div class="trust"><span><i class="dia"></i><b data-i18n="tr1"></b></span><span><i class="dia"></i><b data-i18n="tr2"></b></span><span><i class="dia"></i><b data-i18n="tr3"></b></span></div>
      </div>
      <div class="filters">
        <input id="q" type="search" data-i18n-ph="search" aria-label="Recherche">
        <select id="fcountry" aria-label="Pays"></select>
      </div>
      <div class="chips" id="cats"></div>
      <div id="shopHead" hidden></div>
      <div class="countrow"><span id="count"></span><select id="fsort" aria-label="Tri"><option value="new" data-i18n="sort_new"></option><option value="asc" data-i18n="sort_asc"></option><option value="desc" data-i18n="sort_desc"></option></select></div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="v-vendre" data-view hidden>
      <h2 data-i18n="s_title"></h2>
      <p class="meta" data-i18n="s_sub" style="margin:6px 0 14px"></p>
      <div id="sellNote"></div>
      <p class="meta" id="noPhotos" data-i18n="no_photos" hidden></p>
      <div class="panel" id="sellPanel" hidden>
        <form id="sellForm">
          <div id="photoBlock">
            <div style="font-weight:700;font-size:.92rem;margin-bottom:6px" data-i18n="s_photos"></div>
            <label class="drop"><span data-i18n="s_add"></span><span class="meta" data-i18n="s_hint"></span><input id="s_files" type="file" accept="image/*" multiple></label>
            <div class="thumbs" id="thumbs" style="margin-top:10px"></div>
          </div>
          <label><span data-i18n="s_name"></span><input id="s_title" required maxlength="80"></label>
          <div class="row2">
            <label><span data-i18n="s_cat"></span><select id="s_cat"></select></label>
            <label><span data-i18n="s_cond"></span><select id="s_cond"></select></label>
          </div>
          <div class="row2">
            <label><span data-i18n="s_price"></span><input id="s_price" type="number" min="1" step="any" required inputmode="decimal"></label>
            <label><span data-i18n="s_cur"></span><select id="s_cur"><option>XOF</option><option>GHS</option><option>NGN</option><option>KES</option><option>USD</option></select></label>
          </div>
          <div class="row2">
            <label><span data-i18n="country"></span><select id="s_country"></select></label>
            <label><span data-i18n="city"></span><input id="s_city" required maxlength="40"></label>
          </div>
          <label><span data-i18n="s_deliv"></span><select id="s_deliv"></select></label>
          <label><span data-i18n="s_desc"></span><textarea id="s_desc" maxlength="400"></textarea></label>

function cleanChat(id,d){
  var m=Array.isArray(d.members)?d.members.slice(0,2).map(String):[];
  var buyer=m[0]===uid;
  return {id:id,members:m,listingId:String(d.listingId||''),title:String(d.title||'').slice(0,80),bn:String(d.bn||'').slice(0,60),sn:String(d.sn||'').slice(0,60),
    other:String((buyer?d.sn:d.bn)||'').slice(0,60)||'—',last:String(d.last||'').slice(0,200),lastFrom:String(d.lastFrom||''),ts:Number(d.ts)||0};
}
function seenLoad(){try{seen=JSON.parse(localStorage.getItem('bk-seen-'+uid)||'{}')||{}}catch(e){seen={}}}
function seenSave(){try{localStorage.setItem('bk-seen-'+uid,JSON.stringify(seen))}catch(e){}}
function markSeen(){
  var c=chats.filter(function(x){return x.id===cur})[0];
  if(c&&c.ts>(seen[c.id]||0)){seen[c.id]=c.ts;seenSave()}
  updateUnread();
}
function startChats(){
  if(unsubChats)unsubChats();
  var me=uid;
  unsubChats=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me)),function(s){
    chats=s.docs.map(function(d){return cleanChat(d.id,d.data()||{})}).sort(function(a,b){return b.ts-a.ts});
    if(draft&&chats.some(function(c){return c.id===draft.id}))draft=null;
    if(location.hash==='#messages')markSeen();else updateUnread();
    renderThreads();
  },function(){});
}
function stopChats(){
  if(unsubChats){unsubChats();unsubChats=null}
  if(unsubMsgs){unsubMsgs();unsubMsgs=null}
  chats=[];msgs=[];cur=null;draft=null;seen={};updateUnread();
}
function openChat(id){
  cur=id;msgs=[];
  if(unsubMsgs){unsubMsgs();unsubMsgs=null}
  var isNew=draft&&draft.id===id&&!draft.sent;
  if(!isNew){
    unsubMsgs=onSnapshot(query(collection(db,'chats',id,'msgs'),orderBy('ts','desc'),limit(100)),function(s){
      if(cur!==id)return;
      msgs=s.docs.map(function(d){var x=d.data()||{};return {from:String(x.from||''),text:String(x.text||'').slice(0,1000),ts:Number(x.ts)||0}}).sort(function(a,b){return a.ts-b.ts});
      if(location.hash==='#messages')markSeen();
      renderThreads();
    },function(){});
  }
  renderThreads();
}
async function sendMsg(){
  var inp=$('msgIn');if(!inp||!uid||!cur||sendBusy)return;
  var v=inp.value.trim().slice(0,1000);if(!v)return;
  var c=(draft&&draft.id===cur)?draft:chats.filter(function(x){return x.id===cur})[0];if(!c)return;
  sendBusy=true;var now=Date.now(),first=!!(c.draft&&!c.sent);
  try{
    if(first){await setDoc(doc(db,'chats',c.id),{members:c.members,listingId:c.listingId,title:c.title,bn:c.bn,sn:c.sn,last:v.slice(0,200),lastFrom:uid,ts:now});c.sent=true}
    await addDoc(collection(db,'chats',c.id,'msgs'),{from:uid,text:v,ts:now});
    if(!first)await updateDoc(doc(db,'chats',c.id),{last:v.slice(0,200),lastFrom:uid,ts:now});
    inp.value='';
    if(first)openChat(c.id);
  }catch(e){toast(t('err'))}
  finally{sendBusy=false}
}
function startChatWith(p){
  if(!uid){if(openId)closeSheet();toast(t('m_login'));location.hash='#compte';show();return}
  if(p.ownerId===uid){toast(t('m_own'));return}

  if(!chats.some(function(c){return c.id===id}))draft={id:id,members:[uid,p.ownerId],listingId:String(p.id),title:String(p.title).slice(0,80),bn:profile?profile.name:'',sn:p.seller||'',other:p.seller||'—',last:'',lastFrom:'',ts:0,draft:true};
  openChat(id);if(openId)closeSheet();location.hash='#messages';show();
}

function show(){
  var h=location.hash||'#annonces',v=h.slice(1),m;

/* Photos are resized in the browser and stored inside the listing itself (about 40 KB each, 3 at most). */
function readImg(file){return readImgSz(file,640)}
function readImgSz(file,max){return new Promise(function(res){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var m=max,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);try{c.toBlob(function(b){res(b)},'image/jpeg',.65)}catch(e){res(null)}};
  im.onerror=function(){URL.revokeObjectURL(u);res(null)};im.src=u;
})}
function blobToDataUrl(b){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){rej(fr.error)};fr.readAsDataURL(b)})}
function authMsg(e){
  var c=(e&&e.code)||'';
  if(c==='auth/email-already-in-use')return t('e_exists');
  if(c==='auth/weak-password')return t('e_weak');
  if(c==='auth/invalid-email')return t('e_mail');
  if(c==='auth/too-many-requests')return t('e_many');
  if(c==='auth/network-request-failed')return t('e_net');
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return t('e_bad');
  return t('err');
}

/* ---- data ---- */
function startListings(){
  var timer=setTimeout(function(){if(status==='loading'){status='slow';renderGrid()}},10000);
  onSnapshot(query(collection(db,'listings'),orderBy('ts','desc'),limit(40)),function(s){
    clearTimeout(timer);
    Pa=s.docs.map(function(d){return clean(d.id,d.data()||{})});mergeP();
    status='ready';renderGrid();renderAcc();tryPending();
    if(openId){if(byId(openId))renderSheet();else closeSheet()}
  },function(){clearTimeout(timer);status='offline';renderGrid();renderAcc();renderSellGate()});
  onSnapshot(query(collection(db,'shops'),limit(300)),function(s){
    shops={};s.docs.forEach(function(d){shops[d.id]=cleanShop(d.data()||{})});
    renderGrid();if(!shopEditing)renderAcc();if(openId)renderSheet();
  },function(){});
  onSnapshot(query(collection(db,'listings'),where('bu','>',Timestamp.now()),orderBy('bu','desc'),limit(20)),function(s){
    Pb=s.docs.map(function(d){return clean(d.id,d.data()||{})});mergeP();
    renderGrid();if(openId){if(byId(openId))renderSheet();else closeSheet()}
  },function(){});
}
function saveFavs(){var snap=JSON.parse(JSON.stringify(favs)),me=uid;favQ=favQ.then(function(){return setDoc(doc(db,'users',me,'private','favs'),{ids:snap})}).catch(function(){toast(t('err'))})}
async function loadUser(u){
  try{
    var ps=await getDoc(doc(db,'users',u.uid,'private','profile'));
    if(ps.exists()){var d=ps.data()||{};profile={type:d.type==='mer'?'mer':'ind',name:String(d.name||''),cc:String(d.cc||'BF'),tel:String(d.tel||'')}}
  }catch(e){}
  try{
    var fs=await getDoc(doc(db,'users',u.uid,'private','favs'));
    if(fs.exists()){var ids=(fs.data()||{}).ids;if(ids&&typeof ids==='object'){Object.keys(ids).forEach(function(k){if(ids[k])favs[k]=true})}}
  }catch(e){}
}
async function doAuth(form){
  var email=$('au_email').value.trim(),pw=$('au_pw').value;
  var btn=form.querySelector('button[type=submit]');
  if(!email||!pw){toast(t(!email?'e_mail':'e_weak'));return}
  var prof=null;
  if(mode==='signup'){
    prof={type:form.querySelector('input[name=atype]:checked').value,name:$('a_name').value.trim(),cc:$('a_cc').value,tel:$('a_tel').value.trim()};
    if(!prof.name||!prof.tel){toast(t('err'));return}
  }
  btn.disabled=true;
  try{
    if(prof){
      var cred=await createUserWithEmailAndPassword(auth,email,pw);
      profile=prof;
      await setDoc(doc(db,'users',cred.user.uid,'private','profile'),prof);
      renderAcc();renderSellGate();toast(t('a_ok'));
    }else{
      await signInWithEmailAndPassword(auth,email,pw);
    }
  }catch(e){toast(authMsg(e))}
  finally{btn.disabled=false}
}
async function doReset(){
  var el=$('au_email'),email=el?el.value.trim():'';
  if(!email){toast(t('e_first'));return}
  try{await sendPasswordResetEmail(auth,email);toast(t('a_reset_ok'))}catch(e){toast(authMsg(e))}
}
async function postListing(form){
  if(busy||!uid||!profile)return;busy=true;
  var btn=$('s_go');btn.disabled=true;btn.textContent=t('publishing');
  try{
    var imgs=[];for(var i=0;i<photos.length;i++)imgs.push(await blobToDataUrl(photos[i].blob));
    var cc=$('s_cat').value,vid=$('s_vid').value.trim();
    if(vid&&!vidInfo(vid)){toast(t('vd_bad'));busy=false;btn.disabled=false;btn.textContent=t('s_go');return}
    await addDoc(collection(db,'listings'),{title:$('s_title').value.trim(),cat:cc,art:DEFART[cc],imgs:imgs,cc:$('s_country').value,city:$('s_city').value.trim(),
      price:parseFloat($('s_price').value),cur:$('s_cur').value,cond:$('s_cond').value,dv:$('s_deliv').value,text:$('s_desc').value.trim(),vid:vid,
      seller:profile.name,ownerId:uid,phone:profile.tel,v:0,ts:Date.now()});
    photos.forEach(function(p){URL.revokeObjectURL(p.url)});photos=[];form.reset();renderThumbs();
    toast(t('s_ok'));location.hash='#annonces';show();
  }catch(e){toast(t('err'))}
  finally{busy=false;btn.disabled=false;btn.textContent=t('s_go')}
}
function saveProfile(form){
  var p={type:form.querySelector('input[name=atype]:checked').value,name:$('a_name').value.trim(),cc:$('a_cc').value,tel:$('a_tel').value.trim()};
  setDoc(doc(db,'users',uid,'private','profile'),p).then(function(){profile=p;editing=false;renderAcc();renderSellGate();toast(t('a_ok'))}).catch(function(){toast(t('err'))});
}
function deleteListing(id){
  if(!db)return;
  deleteDoc(doc(db,'listings',id)).then(function(){closeSheet();toast(t('deleted'))}).catch(function(){toast(t('err'))});
}

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-fav]');if(g){var id=g.dataset.fav;if(favs[id])delete favs[id];else favs[id]=true;if(uid)saveFavs();renderGrid();if(openId)renderSheet();return}

  if(e.target.closest('[data-boostbtn]')){boostOpen=!boostOpen;renderSheet();return}
  var sb=e.target.closest('[data-setboost]');if(sb){if(isAdmin())setBoost(sb.dataset.id,sb.dataset.setboost);return}
  if(e.target.closest('[data-edit]')){editOpen=true;renderSheet();return}
  if(e.target.closest('[data-editcancel]')){editOpen=false;renderSheet();return}
  var sd=e.target.closest('[data-sold]');if(sd){setSold(sd.dataset.sold);return}
  if(e.target.closest('[data-report]')){if(!uid){toast(t('rp_login'));return}reportOpen=!reportOpen;renderSheet();return}
  var rr=e.target.closest('[data-rpreason]');if(rr){sendReport(rr.dataset.rpreason);return}
  var dl=e.target.closest('[data-del]');if(dl){if(!confirmDel){confirmDel=true;renderSheet()}else deleteListing(dl.dataset.del);return}

  var gb=e.target.closest('[data-gi]');if(gb){gi=+gb.dataset.gi;renderSheet();return}

  var md=e.target.closest('[data-mode]');if(md){mode=md.dataset.mode;renderAcc();return}
  if(e.target.closest('[data-reset]')){doReset();return}
  if(e.target.id==='editBtn'){editing=true;renderAcc();return}
  if(e.target.id==='cancelEdit'){editing=false;renderAcc();return}
  if(e.target.id==='out'){signOut(auth).catch(function(){})}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&openId){closeSheet();return}
  if(e.key==='Tab'&&openId){var f=$('sheet').querySelectorAll('button,a[href]');if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
$('s_files').addEventListener('change',function(e){
  var fl=Array.prototype.slice.call(e.target.files||[]);e.target.value='';

document.addEventListener('change',function(e){

document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='authForm')doAuth(e.target);
  else if(e.target.id==='accForm')saveProfile(e.target);
  else if(e.target.id==='sellForm')postListing(e.target);

$('q').addEventListener('input',renderGrid);
$('fcountry').addEventListener('change',renderGrid);
$('fsort').addEventListener('change',function(e){sortBy=e.target.value;renderGrid()});
$('lang').addEventListener('change',function(e){lang=e.target.value;try{localStorage.setItem('bk-lang',lang)}catch(x){}applyLang()});
window.addEventListener('hashchange',show);

function init(){
  try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}
  catch(e){status='offline';authReady=true;renderGrid();renderAcc();renderSellGate();return}
  startListings();
  onAuthStateChanged(auth,async function(u){
    if(u){uid=u.uid;mode='login';await loadUser(u);seenLoad();startChats()}
    else{stopChats();uid=null;profile=null;favs={};editing=false;shopEditing=false;shopLogoNew=null}
    authReady=true;
    renderGrid();renderAcc();renderSellGate();renderThreads();if(openId)renderSheet();
  },function(){authReady=true;renderAcc();renderSellGate()});
}
applyLang();show();init();
